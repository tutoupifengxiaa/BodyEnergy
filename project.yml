name: BodyEnergy
options:
  bundleIdPrefix: com.tutoupifengxiaa
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  BodyEnergy:
    type: application
    platform: iOS
    dependencies:
      - target: BodyEnergyWatch
    sources:
      - path: BodyEnergy/App
      - path: BodyEnergy/Health
      - path: BodyEnergy/Energy
      - path: BodyEnergy/Shared/Models
      - path: BodyEnergy/Shared/ViewModels
      - path: BodyEnergy/Shared/Sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergy
        PRODUCT_NAME: BodyEnergy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Body Energy uses your health data to calculate Energy and Recovery scores.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Body Energy may write workout-related updates when enabled in future versions.
        CODE_SIGN_ENTITLEMENTS: BodyEnergy/App/BodyEnergy.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BodyEnergyTests

  BodyEnergyWatch:
    type: application
    platform: watchOS
    sources:
      - path: BodyEnergy/Watch
      - path: BodyEnergy/Shared/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergy.watch
        PRODUCT_NAME: BodyEnergyWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tutoupifengxiaa.BodyEnergy

  BodyEnergyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BodyEnergy/Tests
    dependencies:
      - target: BodyEnergy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergyTests
        GENERATE_INFOPLIST_FILE: YES
