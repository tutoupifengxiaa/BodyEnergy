name: BodyEnergy
options:
  bundleIdPrefix: com.tutoupifengxiaa
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  BodyEnergy:
    type: application
    platform: iOS
    dependencies:
      - target: BodyEnergyWatch
        embed: true
    sources:
      - path: BodyEnergy/App
      - path: BodyEnergy/Health
      - path: BodyEnergy/Energy
      - path: BodyEnergy/Shared/Models
      - path: BodyEnergy/Shared/ViewModels
      - path: BodyEnergy/Shared/Sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergy
        PRODUCT_NAME: BodyEnergy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Body Energy 会读取你的健康数据，用于计算身体电量与恢复分数。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 未来版本启用相关功能后，Body Energy 可能写入与你训练相关的健康更新。
        CODE_SIGN_ENTITLEMENTS: BodyEnergy/App/BodyEnergy.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BodyEnergyTests

  BodyEnergyWatch:
    type: application.watchapp2
    platform: watchOS
    dependencies:
      - target: BodyEnergyWidget
        embed: true
    sources:
      - path: BodyEnergy/Watch
      - path: BodyEnergy/Shared/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergy.watchkitapp
        PRODUCT_NAME: BodyEnergyWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.tutoupifengxiaa.BodyEnergy
        CODE_SIGN_ENTITLEMENTS: BodyEnergy/Watch/BodyEnergyWatch.entitlements

  BodyEnergyWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: BodyEnergy/Widget
      - path: BodyEnergy/Shared/Models/WidgetMetricsSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergy.watchkitapp.watchkitextension.complication
        PRODUCT_NAME: BodyEnergyWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BodyEnergy/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BodyEnergy/Widget/BodyEnergyWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  BodyEnergyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BodyEnergy/Tests
    dependencies:
      - target: BodyEnergy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tutoupifengxiaa.BodyEnergyTests
        GENERATE_INFOPLIST_FILE: YES
